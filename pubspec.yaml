name: flowcraft
description: >-
  FlowCraft — a Miro / Excalidraw-style interactive whiteboard desktop app
  for macOS, Windows, and Linux, with a built-in MCP control server so AI
  coding agents can draw diagrams live on the canvas.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  google_fonts: ^8.2.1
  material_symbols_icons: ^4.2960.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/my-logo.png
