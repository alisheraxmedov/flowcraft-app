name: Build Desktop Installers

on:
  push:
    branches:
      - feature/flowcraft-app
  workflow_dispatch: {}

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version: *//' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Pre-compiled so end users never need the Dart SDK — they just
      # download this alongside the app installer and point their AI CLI
      # at it (see mcp_server/README.md).
      - name: Build MCP server binary
        working-directory: mcp_server
        run: |
          set -euo pipefail
          dart pub get
          mkdir -p build
          dart compile exe bin/flowcraft_mcp_server.dart -o build/flowcraft_mcp_server

      - uses: actions/upload-artifact@v7
        with:
          name: flowcraft-mcp-server-macos
          path: mcp_server/build/flowcraft_mcp_server
          if-no-files-found: error

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get

      # This app has no Flutter plugins, so `flutter build macos` skips its
      # usual CocoaPods bookkeeping (see hasPlugins() in flutter_tools'
      # cocoapod_utils.dart) — but the Xcode project's "Check Pods
      # Manifest.lock" script phase still runs and fails on a fresh
      # checkout because there's no Podfile.lock yet. That first build
      # attempt also applies Podfile/Xcode-project migrations (e.g. bumping
      # the minimum deployment target to match this runner's Flutter SDK),
      # which `pod install` needs to have already happened, or CocoaPods
      # rejects FlutterMacOS.podspec as requiring a higher deployment
      # target. So: let the first attempt run and fail (migrations still
      # apply), pod install against the now-migrated Podfile, then build
      # again for real.
      - name: Prime CocoaPods (expected to fail once)
        run: flutter build macos --release || true

      - name: Install CocoaPods dependencies
        working-directory: example/macos
        run: pod install --repo-update

      - run: flutter build macos --release

      - name: Package .dmg
        run: |
          set -euo pipefail
          mkdir -p dist
          hdiutil create -volname "FlowCraft" \
            -srcfolder "build/macos/Build/Products/Release/flowcraft_example.app" \
            -ov -format UDZO \
            "dist/FlowCraft-macOS-${{ steps.version.outputs.version }}.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: flowcraft-macos-installer
          path: example/dist/*.dmg
          if-no-files-found: error

  build-windows:
    name: Windows (installer)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version: *//' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Pre-compiled so end users never need the Dart SDK — they just
      # download this alongside the app installer and point their AI CLI
      # at it (see mcp_server/README.md).
      - name: Build MCP server binary
        working-directory: mcp_server
        shell: bash
        run: |
          set -euo pipefail
          dart pub get
          mkdir -p build
          dart compile exe bin/flowcraft_mcp_server.dart -o build/flowcraft_mcp_server.exe

      - uses: actions/upload-artifact@v7
        with:
          name: flowcraft-mcp-server-windows
          path: mcp_server/build/flowcraft_mcp_server.exe
          if-no-files-found: error

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Build installer (Inno Setup)
        shell: cmd
        run: >-
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          /DMyAppVersion=${{ steps.version.outputs.version }}
          windows\installer\flowcraft.iss

      - uses: actions/upload-artifact@v7
        with:
          name: flowcraft-windows-installer
          path: example/windows/installer/Output/*.exe
          if-no-files-found: error

  build-linux:
    name: Linux (.deb)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version: *//' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config libblkid-dev liblzma-dev

      # Pre-compiled so end users never need the Dart SDK — they just
      # download this alongside the app installer and point their AI CLI
      # at it (see mcp_server/README.md).
      - name: Build MCP server binary
        working-directory: mcp_server
        run: |
          set -euo pipefail
          dart pub get
          mkdir -p build
          dart compile exe bin/flowcraft_mcp_server.dart -o build/flowcraft_mcp_server

      - uses: actions/upload-artifact@v7
        with:
          name: flowcraft-mcp-server-linux
          path: mcp_server/build/flowcraft_mcp_server
          if-no-files-found: error

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release

      - name: Package .deb
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash linux/packaging/build_deb.sh

      - uses: actions/upload-artifact@v7
        with:
          name: flowcraft-linux-installer
          path: example/dist/*.deb
          if-no-files-found: error
