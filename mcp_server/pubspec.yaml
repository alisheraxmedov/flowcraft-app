name: flowcraft_mcp_server
description: >
  Isolated MCP (Model Context Protocol) bridge for FlowCraft. Lets AI coding
  agents (Claude Code, Codex CLI, Gemini CLI, etc.) draw diagrams live on a
  running FlowCraft desktop app via stdio.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  dart_mcp: ^0.5.2

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
